<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HabitLedger</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --card-bg: #f5f5f5;
      --progress-bg: #e0e0e0;
      --progress-fill: #4ade80;
      --label: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #f5f5f5;
        --card-bg: #2a2a2a;
        --progress-bg: #3a3a3a;
        --progress-fill: #4ade80;
        --label: #9ca3af;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      max-width: 400px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }

    .label {
      font-size: 12px;
      color: var(--label);
      margin-bottom: 6px;
    }

    .value {
      font-size: 20px;
      font-weight: 600;
    }

    .progress-bar {
      background: var(--progress-bg);
      border-radius: 4px;
      height: 6px;
      margin: 6px 0;
      overflow: hidden;
    }

    .progress-fill {
      background: var(--progress-fill);
      border-radius: 4px;
      height: 100%;
      transition: width 0.3s ease;
    }

    .amounts {
      font-size: 12px;
      color: var(--label);
      display: flex;
      justify-content: space-between;
    }

    .no-goal {
      font-size: 13px;
      color: var(--label);
      font-style: italic;
    }

    .refresh-hint {
      font-size: 10px;
      color: var(--label);
      text-align: center;
      margin-top: 8px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- Block 1: Goal progress -->
  <div class="card">
    <div class="label">🎯 {{goal_name}}</div>
    {{#if_goal}}
    <div class="progress-bar">
      <div class="progress-fill" style="width: {{goal_percent}}%"></div>
    </div>
    <div class="amounts">
      <span>{{current_amount}} ₫</span>
      <span>{{goal_percent}}%</span>
      <span>{{target_amount}} ₫</span>
    </div>
    {{/if_goal}}
    {{#no_goal}}
    <div class="no-goal">Chưa có goal nào đang active</div>
    {{/no_goal}}
  </div>

  <!-- Block 2: Total money -->
  <div class="card">
    <div class="label">💰 Số dư ví</div>
    <div class="value">{{total_money}} ₫</div>
  </div>

  <!-- Block 3: Earned today -->
  <div class="card">
    <div class="label">⚡ Hôm nay</div>
    <div class="value">+{{earned_today}} ₫</div>
  </div>

  <div class="refresh-hint">Tự cập nhật mỗi 30 giây</div>

  <script>
    setInterval(() => location.reload(), 30000);
  </script>
</body>
</html>
